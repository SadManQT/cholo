<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(fonts/inter-latin-900-normal.woff2)}
@font-face{font-family:Baloo;font-weight:500;src:url(fonts/baloo-da-2-bengali-500-normal.woff2)}
@font-face{font-family:Baloo;font-weight:700;src:url(fonts/baloo-da-2-bengali-700-normal.woff2)}
@font-face{font-family:Baloo;font-weight:800;src:url(fonts/baloo-da-2-bengali-800-normal.woff2)}
:root{--gold:#FBBF2E;--gold2:#FFE58A;--gold3:#E88A12;--g700:#0C684F;--g800:#0A3D30;--ink:#0E261F;--pink:#F0508C}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#03140F;font-family:Inter,Baloo,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
#bgbase{position:absolute;inset:0;background:radial-gradient(1400px 900px at 30% 25%,#0E5A45 0%,#073026 42%,#03140F 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
#dots{position:absolute;inset:-100px;background-image:radial-gradient(rgba(255,255,255,.09) 1.6px,transparent 1.8px);background-size:46px 46px}
.streak{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(251,191,46,.0) 10%,rgba(255,229,138,.8) 80%,#fff);filter:blur(.4px)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#sweep{position:absolute;top:-400px;width:360px;height:1900px;background:linear-gradient(90deg,transparent,rgba(255,229,138,.22),rgba(255,255,255,.35),rgba(255,229,138,.22),transparent);transform:rotate(18deg);filter:blur(8px);pointer-events:none}
#black{position:absolute;inset:0;background:#000;pointer-events:none}
#wm{position:absolute;left:64px;top:46px;width:150px}
#wmtxt{position:absolute;right:64px;top:62px;font-size:17px;letter-spacing:5px;font-weight:600;color:rgba(255,255,255,.55)}

.tb{position:absolute}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font-size:21px;font-weight:700;letter-spacing:5px;color:var(--gold);text-transform:uppercase}
.eyebrow .n{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:2px solid rgba(251,191,46,.6);font-size:17px;letter-spacing:0}
.hl{margin:26px 0 0;font-size:94px;line-height:1.02;font-weight:800;letter-spacing:-3px}
.hl .ln{display:block;white-space:nowrap}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:0 4px 14px 0;margin-bottom:-14px}
.wi{display:inline-block}
.goldt{background:linear-gradient(180deg,#FFE58A 0%,#FBBF2E 55%,#E88A12 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pinkt{background:linear-gradient(180deg,#FFC2DA 0%,#F472B6 55%,#E11D74 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:30px 0 0;font-size:30px;line-height:1.42;font-weight:500;color:rgba(255,255,255,.74)}
.bl{list-style:none;margin:38px 0 0;padding:0}
.bl li{display:flex;align-items:center;gap:18px;font-size:27px;font-weight:600;margin-bottom:20px;color:#fff}
.ck{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(251,191,46,.16);border:2px solid rgba(251,191,46,.55)}
.ck svg{width:22px;height:22px;stroke:var(--gold);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.redt{background:linear-gradient(180deg,#FFD1D1 0%,#F87171 50%,#DC2626 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.redset .ck{background:rgba(220,38,38,.18);border-color:rgba(248,113,113,.7)}
.redset .ck svg{stroke:#FCA5A5}
.redset .eyebrow{color:#FCA5A5}
.redset .eyebrow .n{border-color:rgba(252,165,165,.6)}
.pinkset .ck{background:rgba(240,80,140,.16);border-color:rgba(244,114,182,.6)}
.pinkset .ck svg{stroke:#F9A8D4}
.pinkset .eyebrow{color:#F9A8D4}
.pinkset .eyebrow .n{border-color:rgba(249,168,212,.6)}

.phone{position:absolute;width:400px;height:830px;border-radius:66px;background:linear-gradient(145deg,#2c3834,#0b100e 40%,#1b2320);padding:13px;box-shadow:0 80px 140px -30px rgba(0,0,0,.75),0 30px 60px -20px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.1)}
.screen{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:#fff;color:var(--ink)}
.island{position:absolute;top:12px;left:50%;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px;z-index:60}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 38px;font-weight:700;font-size:16px;z-index:55}
.sbar i{display:inline-block;width:26px;height:12px;border-radius:4px;border:2px solid currentColor;position:relative;opacity:.9}
.sbar i:after{content:'';position:absolute;inset:1px;right:5px;background:currentColor;border-radius:1px}
.glare{position:absolute;inset:0;border-radius:54px;background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 32%);pointer-events:none;z-index:70}

.card{position:absolute;background:#fff;border-radius:22px;box-shadow:0 14px 40px -12px rgba(8,40,30,.35);color:var(--ink)}
.glass{position:absolute;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.18);border-radius:36px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);backdrop-filter:blur(18px)}
.pill{position:absolute;display:flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);font-size:24px;font-weight:700;white-space:nowrap;backdrop-filter:blur(14px);box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.pill svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;flex:none}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center}
.center{position:absolute;left:0;right:0;text-align:center}
</style>
</head>
<body>
<div id="stage">

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const E={
  out:t=>1-Math.pow(1-t,3),
  out5:t=>1-Math.pow(1-t,5),
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},

const I={

  pkg:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',

  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',

const ic=(n,st='')=>`<svg viewBox="0 0 24 24" class="ico" style="${st}">${I[n]}</svg>`;
const VEH={
  bike:`<svg viewBox="0 0 48 32" style="width:100%;height:100%"><g fill="none" stroke="#0E261F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="22" r="7"/><circle cx="37" cy="22" r="7"/><path d="M11 22 19 11h10l8 11M19 11l-3-4h-4M29 11l-4 11H18"/></g><rect x="24" y="6" width="9" height="4" rx="2" fill="#0C684F"/></svg>`,

  car:`<svg viewBox="0 0 48 32" style="width:100%;height:100%"><path d="M7 19l4-8c1-2 3-3 5-3h15c2 0 4 1 5 3l4 8h1c2 0 3 1 3 3v3c0 1-1 2-2 2H5c-1 0-2-1-2-2v-3c0-2 1-3 3-3z" fill="#0C684F"/><path d="M13 11h9v7H10zM25 11h7c1 0 2 1 2 1l3 6H25z" fill="#CFFAE6"/><circle cx="14" cy="27" r="4.5" fill="#0E261F"/><circle cx="35" cy="27" r="4.5" fill="#0E261F"/><circle cx="14" cy="27" r="1.8" fill="#9CA3AF"/><circle cx="35" cy="27" r="1.8" fill="#9CA3AF"/></svg>`,
};

function tbHTML({id,num,eyebrow,hl,sub,bullets=[],x,y,w=820,pink=false,red=false,align='left'}){
  const lines=hl.split('|').map(l=>{
    const g=l.startsWith('~'), pk=l.startsWith('^'), rd=l.startsWith('!'); const txt=(g||pk||rd)?l.slice(1):l;
    return `<span class="ln">${txt.split(' ').map(w=>`<span class="wm"><span class="wi anim-w ${g?'goldt':pk?'pinkt':rd?'redt':''}">${w}</span></span>`).join(' ')}</span>`;
  }).join('');
  return `<div class="tb ${pink?'pinkset':red?'redset':''}" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;text-align:${align}">
    <div class="eyebrow anim"><span class="n">${num}</span>${eyebrow}</div>
    <h2 class="hl">${lines}</h2>
    ${sub?`<p class="sub anim">${sub}</p>`:''}
    ${bullets.length?`<ul class="bl">${bullets.map(b=>`<li class="anim"><span class="ck">${ic('check')}</span>${b}</li>`).join('')}</ul>`:''}
  </div>`;
}
function animTB(root,lt,start=.25){
  if(!root) return;
  let d=start;
  const eb=$('.eyebrow',root); const k0=P(lt,d,d+.6); S(eb,{x:(1-k0)*-30,op:k0}); d+=.15;
  $$('.anim-w',root).forEach(w=>{const k=P(lt,d,d+.7,E.out5); w.style.transform=`translateY(${(1-k)*110}%)`; d+=.06;});
  d+=.1;
  $$('.sub.anim,.bl li.anim',root).forEach(el=>{const k=P(lt,d,d+.6); S(el,{y:(1-k)*28,op:k}); d+=.14;});
}
function phoneHTML(id,inner,{dark=false}={}){
  return `<div class="phone" id="${id}"><div class="screen" style="${dark?'background:#0B1512;color:#EEF1E9':''}"><div class="island"></div>
  <div class="sbar" style="color:${dark?'#EEF1E9':'#0E261F'}"><span>9:41</span><span style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;letter-spacing:1px">5G</span><i></i></span></div>
  ${inner}<div class="glare"></div></div></div>`;
}

    <g stroke="#fff" stroke-width="14"><path d="M90 820V470q0-30 30-30h110q30 0 30-30V-20"/><path d="M-20 440h400"/><path d="M-20 330h180q30 0 50-20l90-90"/><path d="M200 820 V620"/><path d="M-20 560h120"/><path d="M180 140h210"/></g>
    <g stroke="#fff" stroke-width="7" opacity=".9"><path d="M30 -20V800"/><path d="M330 -20V800"/><path d="M-20 250h400"/><path d="M-20 520h400"/><path d="M150 -20V330"/></g>

   ${route?`<path id="${id}-rc" d="${route}" fill="none" stroke="#0A3D30" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".25"/>

const pinA=(id)=>`<div id="${id}" class="abs" style="width:0;height:0"><div class="pr abs" style="left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:rgba(12,104,79,.25)"></div><div class="abs" style="left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:#0C684F;border:5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.3)"></div></div>`;
const pinB=(id)=>`<div id="${id}" class="abs" style="width:0;height:0"><svg class="abs" viewBox="0 0 40 52" style="left:-20px;top:-50px;width:40px;height:52px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))"><path d="M20 2C10 2 2 10 2 20c0 13 18 30 18 30s18-17 18-30C38 10 30 2 20 2z" fill="#F2A81D" stroke="#fff" stroke-width="3"/><circle cx="20" cy="20" r="6.5" fill="#fff"/></svg></div>`;

const SC=[];
const add=(a,b,html,u,{fade=true}={})=>SC.push({a,b,html,u,fade});

/* ---------- S0 intro ---------- */
add(0,6,`
 <svg class="abs" id="s0route" viewBox="0 0 1920 1080" style="inset:0;width:1920px;height:1080px">
   <path id="s0p" d="M300 820 C600 700 760 900 1000 800 S1420 660 1640 760" fill="none" stroke="url(#s0g)" stroke-width="6" stroke-linecap="round"/>
   <defs><linearGradient id="s0g" x1="0" x2="1"><stop offset="0" stop-color="#FBBF2E" stop-opacity="0"/><stop offset=".3" stop-color="#FBBF2E"/><stop offset="1" stop-color="#FFE58A"/></linearGradient></defs>

 </svg>
 <div class="abs" id="s0logo" style="left:510px;top:250px;width:900px;height:333px">
   <img src="logo.svg" style="width:900px;display:block;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))">
   <div id="s0shine" class="abs" style="inset:0;-webkit-mask:url(logo.svg) center/100% 100% no-repeat;mask:url(logo.svg) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);background-size:300% 100%"></div>
