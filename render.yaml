services:
  - type: web
    name: cholo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cholo-postgres
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: 30
      - key: GEO_PROVIDER
        value: osm
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: PAYMENT_GATEWAY
        value: sslcommerz
      - key: SSLCOMMERZ_BASE_URL
        value: https://sandbox.sslcommerz.com
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false

databases:
  - name: cholo-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: cholo
    user: cholo
