services:
  - type: web
    name: cholo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Postgres (free, doesn't expire). Use the Session pooler connection string — Render has no
      # IPv6, and Supabase's direct connection is IPv6-only. Don't add ?sslmode=…; DATABASE_SSL handles TLS.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Supabase Storage for driver documents and profile photos (Render's disk is wiped on every restart).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: 30
      # Photon allows search-as-you-type; the public Nominatim server's usage policy forbids it.
      - key: GEO_PROVIDER
        value: photon
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: PHOTON_BASE_URL
        value: https://photon.komoot.io
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      # Only when OSRM_BASE_URL / PHOTON_BASE_URL point at your own servers (see docs/maps-scaling-tutorial.html).
      - key: GEO_UPSTREAM_TOKEN
        sync: false
      # Drivers must be this close to the pickup, a stop or the drop-off to slide. 0 turns it off.
      - key: ARRIVAL_RADIUS_METERS
        value: "300"
      - key: PAYMENT_GATEWAY
        value: sslcommerz
      - key: SSLCOMMERZ_BASE_URL
        value: https://sandbox.sslcommerz.com
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
