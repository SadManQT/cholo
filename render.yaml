services:
  - type: web
    name: cholo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: 30
      - key: GEO_PROVIDER
        value: photon
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: PHOTON_BASE_URL
        value: https://photon.komoot.io
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: GEO_UPSTREAM_TOKEN
        sync: false
      - key: ARRIVAL_RADIUS_METERS
        value: "300"
      - key: PAYMENT_GATEWAY
        value: sslcommerz
      - key: SSLCOMMERZ_BASE_URL
        value: https://sandbox.sslcommerz.com
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: BULKSMSBD_API_KEY
        sync: false
      - key: BULKSMSBD_SENDER_ID
        sync: false
